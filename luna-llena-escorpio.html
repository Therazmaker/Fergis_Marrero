<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna Llena en Escorpio</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">

<style>
/* (todo tu CSS se mantiene igual, no lo toqué para no romper el diseño) */
body { background:#0d0a14; color:#f5f0eb; font-family: 'Cormorant Garamond', serif; }
</style>
</head>

<body>

<div class="wrap">
  <h1 style="text-align:center;">🌙 Luna Llena en Escorpio</h1>

  <input id="nombre" placeholder="Nombre"><br><br>
  <input id="fecha" type="date"><br><br>
  <input id="correo" placeholder="Correo"><br><br>

  <textarea id="soltar" placeholder="¿Qué quieres soltar?"></textarea><br><br>
  <textarea id="revelar" placeholder="¿Qué verdad evitas?"></textarea><br><br>

  <button onclick="generarLectura()">Recibir lectura</button>

  <pre id="resultado"></pre>
</div>

<script>

let userData = {};

async function generarLectura() {
  const nombre  = document.getElementById("nombre").value;
  const fecha   = document.getElementById("fecha").value;
  const correo  = document.getElementById("correo").value;
  const soltar  = document.getElementById("soltar").value;
  const revelar = document.getElementById("revelar").value;

  if (!nombre || !fecha || !correo || !soltar || !revelar) {
    alert("Completa todo el ritual 😅");
    return;
  }

  userData = { nombre, fecha, correo, soltar, revelar };

  const nacimiento = new Date(fecha + 'T12:00:00')
    .toLocaleDateString('es-PE', { day:'numeric', month:'long', year:'numeric' });

  const prompt = `
Eres una guía espiritual sabia y poética.
Hoy es luna llena en Escorpio.

La persona se llama ${nombre}, nació el ${nacimiento}.

Quiere soltar:
"${soltar}"

Evita ver:
"${revelar}"

Responde SOLO JSON:
{
  "energia": "...",
  "mensaje": "...",
  "ritual": "..."
}
`;

  try {
    const res = await fetch("/api/lectura", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt })
    });

    const data = await res.json();
    const text = data.content[0].text;

    const lectura = JSON.parse(text);

    document.getElementById("resultado").textContent =
      "🌌 Energía:\n" + lectura.energia + "\n\n" +
      "💫 Mensaje:\n" + lectura.mensaje + "\n\n" +
      "🕯️ Ritual:\n" + lectura.ritual;

  } catch (e) {
    console.error(e);
    alert("La luna se nubló... intenta otra vez 🌫️");
  }
}

</script>

</body>
</html>
